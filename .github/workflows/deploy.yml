name: Deploy frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: inkfig-user-fe-production
  cancel-in-progress: false

env:
  VITE_USER_API_BASE_URL: https://user-api.inkfig-hu.com/api/v1
  VITE_MAIN_API_BASE_URL: https://main-api.inkfig-hu.com/api/v1

jobs:
  test-build-deploy:
    name: Test, build, and deploy to Cloudflare
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build production frontend
        run: npm run build

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify production frontend
        run: curl --fail --silent --show-error https://inkfig-hu.com

